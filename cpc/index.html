<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CPC Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #001F3F;
    color: #fff;
    min-height: 100vh;
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.6rem; text-align: center; margin-bottom: 0.3rem; }
  .subtitle { text-align: center; color: #a8c5e8; margin-bottom: 2rem; font-size: 0.95rem; }
  .card {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(0,102,255,0.3);
    border-radius: 14px;
    padding: 1.6rem;
    backdrop-filter: blur(8px);
    margin-bottom: 1rem;
  }
  input[type=password], input[type=tel] {
    width: 100%;
    padding: 0.9rem 1rem;
    font-size: 1.3rem;
    letter-spacing: 4px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #0066FF;
    background: rgba(0,0,0,0.3);
    color: #fff;
    margin-bottom: 1rem;
  }
  button {
    display: block;
    width: 100%;
    padding: 0.9rem;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #0066FF;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(0,102,255,0.5);
  }
  button:hover { box-shadow: 0 0 24px rgba(0,102,255,0.8); }
  button.secondary { background: transparent; border: 1px solid #0066FF; box-shadow: none; margin-top: 0.6rem; }
  button.copy-btn { background: #1a3a5c; box-shadow: none; font-size: 0.85rem; padding: 0.6rem; margin-top: 0.6rem; }
  button.copy-btn.copied { background: #1e7a3a; }
  #err { color: #FF6B6B; text-align: center; margin-bottom: 1rem; min-height: 1.2em; }

  .topic-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .topic-btn {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(0,102,255,0.3);
    border-radius: 10px; padding: 0.9rem 1.1rem; cursor: pointer; text-align: left;
    color: #fff; font-size: 0.95rem;
  }
  .topic-btn:hover { border-color: #0066FF; }
  .badge { font-weight: 700; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap; margin-left: 0.8rem; }
  .badge.none { background: rgba(255,255,255,0.1); color: #a8c5e8; }
  .badge.low { background: rgba(255,107,107,0.25); color: #FF6B6B; }
  .badge.mid { background: rgba(255,193,7,0.25); color: #FFC107; }
  .badge.high { background: rgba(40,167,69,0.25); color: #4CD964; }
  .badge.prog { background: rgba(0,102,255,0.3); color: #7fbfff; }

  .progress-bar { height: 6px; background: rgba(0,102,255,0.2); border-radius: 3px; overflow: hidden; margin-bottom: 1.4rem; }
  .progress-fill { height: 100%; background: #0066FF; width: 0%; transition: width 0.3s; }
  .q-count { text-align: center; color: #a8c5e8; font-size: 0.85rem; margin-bottom: 0.6rem; }
  .q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.3rem; line-height: 1.5; white-space: pre-line; }
  .section-title { margin: 1.4rem 0 0.2rem; font-size: 1.05rem; color: #a8c5e8; }
  .section-title small { display: block; font-size: 0.8rem; color: #7fa8d9; font-weight: 400; margin-top: 0.2rem; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 0.9rem 1rem;
    background: rgba(0,0,0,0.2); border: 2px solid rgba(0,102,255,0.3); border-radius: 10px;
    color: #fff; margin-bottom: 0.7rem; cursor: pointer; font-size: 0.95rem;
    box-shadow: none; font-weight: 500;
  }
  .opt:hover { border-color: #0066FF; }
  .opt.correct { border-color: #4CD964; background: rgba(76,217,100,0.2); }
  .opt.wrong { border-color: #FF6B6B; background: rgba(255,107,107,0.2); }
  .opt[disabled] { cursor: default; }
  .explain { background: rgba(0,102,255,0.12); border-left: 3px solid #0066FF; padding: 1rem; border-radius: 8px; margin: 1rem 0; font-size: 0.9rem; line-height: 1.6; display:none; white-space: pre-line; }
  .feedback { text-align: center; font-weight: 700; margin-bottom: 0.8rem; font-size: 1rem; display:none; }
  .feedback.ok { color: #4CD964; }
  .feedback.bad { color: #FF6B6B; }

  .step-lab { font-size: 0.8rem; font-weight: 700; color: #7fa8d9; text-transform: uppercase; letter-spacing: 0.03em; margin: 0.4rem 0 0.6rem; }
  .step-res { font-weight: 600; margin: 0.2rem 0 0.9rem; line-height: 1.4; }
  .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
  .mod-grid .opt { margin-bottom: 0; padding: 0.6rem 0.65rem; font-size: 0.85rem; }
  .sheet-lab { font-size: 0.75rem; color: #7fa8d9; margin: 0.8rem 0 0.35rem; }
  .opt.h-btn { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.7rem 0.9rem; margin-bottom: 0.45rem; }
  .opt.h-btn.sub { padding-left: 1.6rem; font-size: 0.88rem; }
  .h-pg { font-weight: 700; color: #a8c5e8; white-space: nowrap; }

  .result-score { text-align: center; font-size: 3rem; font-weight: 700; margin: 1rem 0 0.3rem; }
  .result-label { text-align: center; color: #a8c5e8; margin-bottom: 1.5rem; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-lock">
    <h1>🔒 CPC Test</h1>
    <p class="subtitle">Acceso privado</p>
    <div class="card">
      <input type="tel" id="pin" maxlength="4" placeholder="••••" inputmode="numeric" autocomplete="off">
      <div id="err"></div>
      <button onclick="tryUnlock()">Entrar</button>
    </div>
  </div>

  <div id="screen-menu" hidden>
    <h1>📘 CPC Transport Manager</h1>
    <p class="subtitle">Elige un tema para empezar el test</p>
    <div id="overall-stats" class="card" style="text-align:center;"></div>
    <div class="topic-list" id="topic-list"></div>
  </div>

  <div id="screen-quiz" hidden>
    <h1 id="quiz-title"></h1>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-count" id="q-count"></div>
    <div class="card">
      <div class="q-text" id="q-text"></div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="explain" id="explain"></div>
      <button class="copy-btn" id="copy-q-btn" onclick="copyCurrentQuestion()" hidden>📋 Copiar esta pregunta</button>
      <button id="next-btn" onclick="nextQuestion()" hidden>Siguiente →</button>
    </div>
    <button class="secondary" onclick="backToMenu()">← Volver a temas (se guarda lo que llevas)</button>
    <button class="secondary" onclick="restartTopic()">↺ Empezar este test de nuevo</button>
  </div>

  <div id="screen-result" hidden>
    <h1 id="result-title"></h1>
    <div class="card">
      <div class="result-score" id="result-score"></div>
      <div class="result-label" id="result-label">respuestas correctas</div>
      <button class="copy-btn" id="copy-all-btn" onclick="copyAllSession()">📋 Copiar todo el test (para Gemini)</button>
      <button onclick="retryTopic()">Repetir este tema</button>
      <button class="secondary" onclick="backToMenu()">Volver a temas</button>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="buscar.js"></script>
<script>
const PIN = '8214';
const STORAGE_KEY = 'cpc_progress_v1';
const UNLOCK_KEY = 'cpc_unlocked_v1';
// Every test keeps its own unfinished attempt, so leaving one to start another loses nothing
const INPROGRESS_KEY = 'cpc_inprogress_v2';
const LAST_TOPIC_KEY = 'cpc_last_topic_v1';
const OLD_INPROGRESS_KEY = 'cpc_inprogress_v1';

function getAllInProgress() {
  let all = {};
  try { all = JSON.parse(localStorage.getItem(INPROGRESS_KEY)) || {}; } catch(e) {}
  // One-off move of the single attempt the previous version kept
  try {
    const old = JSON.parse(localStorage.getItem(OLD_INPROGRESS_KEY));
    if (old && old.topic && !all[old.topic]) {
      all[old.topic] = old;
      localStorage.setItem(INPROGRESS_KEY, JSON.stringify(all));
      localStorage.setItem(LAST_TOPIC_KEY, old.topic);
    }
    localStorage.removeItem(OLD_INPROGRESS_KEY);
  } catch(e) {}
  return all;
}
function saveInProgress() {
  try {
    const all = getAllInProgress();
    all[currentTopic] = {
      topic: currentTopic,
      questions: currentQuestions,
      index: currentIndex,
      score: currentScore,
      log: sessionLog
    };
    localStorage.setItem(INPROGRESS_KEY, JSON.stringify(all));
    localStorage.setItem(LAST_TOPIC_KEY, currentTopic);
  } catch(e) {}
}
function loadInProgress(topic) {
  const state = getAllInProgress()[topic];
  return state && window.CPC_TEMAS[topic] ? state : null;
}
function clearInProgress(topic) {
  try {
    const all = getAllInProgress();
    delete all[topic];
    localStorage.setItem(INPROGRESS_KEY, JSON.stringify(all));
  } catch(e) {}
}
function lastInProgress() {
  let topic = null;
  try { topic = localStorage.getItem(LAST_TOPIC_KEY); } catch(e) {}
  return topic ? loadInProgress(topic) : null;
}

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e) {}
}

function tryUnlock() {
  const val = document.getElementById('pin').value.trim();
  if (val === PIN) {
    try { localStorage.setItem(UNLOCK_KEY, '1'); } catch(e) {}
    const inProgress = lastInProgress();
    if (inProgress) {
      resumeQuiz(inProgress);
    } else {
      showMenu();
    }
  } else {
    document.getElementById('err').textContent = 'Código incorrecto';
    document.getElementById('pin').value = '';
  }
}
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) {
  ['screen-lock','screen-menu','screen-quiz','screen-result'].forEach(s => {
    document.getElementById(s).hidden = (s !== id);
  });
}

function pctClass(pct) {
  if (pct === null) return 'none';
  if (pct < 60) return 'low';
  if (pct < 85) return 'mid';
  return 'high';
}

function showMenu() {
  show('screen-menu');
  const progress = getProgress();
  const unfinished = getAllInProgress();
  const list = document.getElementById('topic-list');
  list.innerHTML = '';
  const keys = Object.keys(window.CPC_TEMAS).sort((a,b) => parseInt(a) - parseInt(b));

  let totalAttempts = 0, totalPct = 0;
  let simulacrosHeaderShown = false, buscarHeaderShown = false;
  keys.forEach(key => {
    const tema = window.CPC_TEMAS[key];
    // Keys from 101 upwards are mixed-topic mock exams, listed under their own heading
    if (!simulacrosHeaderShown && parseInt(key) >= 100) {
      const h = document.createElement('h2');
      h.className = 'section-title';
      h.innerHTML = '📝 Simulacros de examen<small>40 preguntas con temas mezclados, como en el examen real</small>';
      list.appendChild(h);
      simulacrosHeaderShown = true;
    }
    // Keys from 201 upwards are the step-by-step "find it in the book" tests
    if (!buscarHeaderShown && parseInt(key) >= 200) {
      const h = document.createElement('h2');
      h.className = 'section-title';
      h.innerHTML = '🔎 Buscar en el libro<small>Eliges el tema y después el apartado de las hojas de resumen; al final, la página del libro</small>';
      list.appendChild(h);
      buscarHeaderShown = true;
    }
    const rec = progress[key];
    const pct = rec ? Math.round((rec.lastScore / rec.lastTotal) * 100) : null;
    if (rec) { totalAttempts++; totalPct += pct; }

    const open = unfinished[key];
    const badge = open
      ? `<span class="badge prog">▶ Pregunta ${Math.min(open.index + 1, open.questions.length)}/${open.questions.length}</span>`
      : `<span class="badge ${pctClass(pct)}">${pct === null ? 'Sin intentos' : pct + '%'}</span>`;
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    btn.onclick = () => openTopic(key);
    btn.innerHTML = `<span>${tema.title} <span style="color:#7fa8d9;font-size:0.8rem;">(${tema.questions.length} preguntas)</span></span>
      ${badge}`;
    list.appendChild(btn);
  });

  const overall = document.getElementById('overall-stats');
  if (totalAttempts > 0) {
    overall.innerHTML = `<strong>Media general:</strong> ${Math.round(totalPct/totalAttempts)}% &nbsp;·&nbsp; ${totalAttempts}/${keys.length} tests intentados`;
  } else {
    overall.innerHTML = 'Aún no has hecho ningún test. ¡Elige un tema para empezar!';
  }
}

// ---- Quiz state ----
let currentTopic = null;
let currentQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let answered = false;
let sessionLog = [];

function startQuiz(topicKey) {
  currentTopic = topicKey;
  const tema = window.CPC_TEMAS[topicKey];
  if (tema.type === 'buscar') {
    currentQuestions = shuffle(tema.questions).map(q => ({ buscar: true, q: q.q, ans: q.ans, exp: q.exp }));
  } else {
    currentQuestions = shuffle(tema.questions).map(q => {
      // shuffle options too, tracking correct answer text
      const correctText = q.options[q.correct];
      // The mock-exam explanations say "Opción Correcta (A)": those keep the book's order
      // (a unit such as "85 dB(A)" is not a letter)
      const keep = /(^|[^A-Za-z])\([A-F](\)|,| y | and )/.test(q.exp || '') || q.options.some(o => /\b[A-F] (and|y) [A-F]\b/.test(o));
      // "All/None of the above" only makes sense as the last option
      const mixed = shuffle(q.options), last = o => /of the above/i.test(o);
      const opts = keep ? q.options.slice() : mixed.filter(o => !last(o)).concat(mixed.filter(last));
      return { q: q.q, options: opts, correct: opts.indexOf(correctText), exp: q.exp };
    });
  }
  currentIndex = 0;
  currentScore = 0;
  sessionLog = [];
  document.getElementById('quiz-title').textContent = tema.title;
  show('screen-quiz');
  renderQuestion();
}

// From the menu: carry on where the test was left, or start it fresh
function openTopic(topicKey) {
  const state = loadInProgress(topicKey);
  if (state) resumeQuiz(state);
  else startQuiz(topicKey);
}

function resumeQuiz(state) {
  currentTopic = state.topic;
  currentQuestions = state.questions;
  currentIndex = state.index;
  currentScore = state.score;
  sessionLog = state.log || [];
  document.getElementById('quiz-title').textContent = window.CPC_TEMAS[currentTopic].title;
  // The question on screen was already answered (and scored) before leaving: move past it
  if (sessionLog.length > currentIndex) currentIndex = sessionLog.length;
  if (currentIndex >= currentQuestions.length) { finishQuiz(); return; }
  show('screen-quiz');
  renderQuestion();
}

function restartTopic() {
  if (!confirm('¿Empezar este test de nuevo? Se pierde lo que llevas.')) return;
  clearInProgress(currentTopic);
  startQuiz(currentTopic);
}

function formatQuestionText(entry) {
  if (entry.buscar) {
    return `Pregunta: ${entry.q}\n` +
      `Tema: elegí el ${entry.pickedMod} — ${entry.modOk ? 'Correcto' : 'Incorrecto (era el ' + entry.mod + ')'}\n` +
      `Apartado: elegí «${entry.pickedH}» — ${entry.hOk ? 'Correcto' : 'Incorrecto (era «' + entry.okH + '»)'}\n` +
      `Explicación: ${entry.exp}\n`;
  }
  const letters = ['A','B','C','D'];
  let out = `Pregunta: ${entry.q}\n`;
  entry.options.forEach((opt, i) => {
    out += `${letters[i]}) ${opt}${i === entry.correct ? '  [CORRECTA]' : ''}\n`;
  });
  out += `Mi respuesta: ${letters[entry.userIndex]}) ${entry.options[entry.userIndex]} — ${entry.wasCorrect ? 'Correcta' : 'Incorrecta'}\n`;
  out += `Explicación: ${entry.exp}\n`;
  return out;
}

function copyToClipboard(text, btn) {
  const done = () => {
    if (!btn) return;
    const original = btn.textContent;
    btn.textContent = '✅ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (done) done();
}

function copyCurrentQuestion() {
  const entry = sessionLog[sessionLog.length - 1];
  if (!entry) return;
  const btn = document.getElementById('copy-q-btn');
  copyToClipboard(formatQuestionText(entry), btn);
}

function copyAllSession() {
  const tema = window.CPC_TEMAS[currentTopic];
  let out = `TEST: ${tema.title}\n${'='.repeat(40)}\n\n`;
  sessionLog.forEach((entry, i) => {
    out += `--- Pregunta ${i + 1} ---\n` + formatQuestionText(entry) + '\n';
  });
  const btn = document.getElementById('copy-all-btn');
  copyToClipboard(out, btn);
}

function renderQuestion() {
  answered = false;
  const total = currentQuestions.length;
  const q = currentQuestions[currentIndex];
  document.getElementById('progress-fill').style.width = (currentIndex / total * 100) + '%';
  document.getElementById('q-count').textContent = `Pregunta ${currentIndex + 1} de ${total}`;
  document.getElementById('q-text').textContent = q.q;
  saveInProgress();
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('explain').textContent = '';
  document.getElementById('copy-q-btn').hidden = true;
  document.getElementById('next-btn').hidden = true;

  if (q.buscar) { renderBuscarStep1(); return; }

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((optText, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = letters[i] + ') ' + optText;
    b.onclick = () => selectAnswer(i);
    optsDiv.appendChild(b);
  });
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIndex];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.correct) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  if (i === q.correct) {
    currentScore++;
    fb.textContent = '✅ ¡Correcto!';
    fb.className = 'feedback ok';
  } else {
    fb.textContent = '❌ Incorrecto';
    fb.className = 'feedback bad';
  }

  const ex = document.getElementById('explain');
  ex.style.display = 'block';
  ex.textContent = q.exp;

  sessionLog.push({
    q: q.q,
    options: q.options,
    correct: q.correct,
    userIndex: i,
    wasCorrect: i === q.correct,
    exp: q.exp
  });

  document.getElementById('copy-q-btn').hidden = false;
  document.getElementById('next-btn').hidden = false;
  saveInProgress();
}

// ---- "Buscar en el libro": step 1 picks the module, step 2 the heading of its revision summary ----
let bState = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function resumen(n) { return (window.CPC_RESUMENES || []).find(m => m[0] === n); }
// Finds a heading of a module's summary: { sheet, item: [title, page, section, sub, formula] }
function findHeading(n, title) {
  for (const [sheet, , items] of resumen(n)[3]) {
    const item = items.find(it => it[0] === title);
    if (item) return { sheet, item };
  }
  return null;
}

function renderBuscarStep1() {
  bState = { step: 1 };
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '<div class="step-lab">Paso 1 de 2 · ¿En qué tema lo buscas?</div><div class="mod-grid" id="mod-grid"></div><div id="step2"></div>';
  const grid = document.getElementById('mod-grid');
  (window.CPC_RESUMENES || []).forEach(m => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b>${m[0]}</b> · ${esc(m[1])}`;
    b.onclick = () => pickModule(m[0]);
    grid.appendChild(b);
  });
}

function pickModule(n) {
  if (!bState || bState.step !== 1) return;
  const q = currentQuestions[currentIndex];
  const okMods = q.ans.map(a => a[0]);
  bState = { step: 2, pickedMod: n, modOk: okMods.includes(n), mod: okMods.includes(n) ? n : okMods[0] };
  document.getElementById('mod-grid').style.display = 'none';
  const m = resumen(bState.mod);
  const res = bState.modOk
    ? `✅ Tema ${m[0]} · ${esc(m[1])}`
    : `❌ Elegiste el tema ${n}. Es el tema ${m[0]} · ${esc(m[1])}`;
  let h = `<div class="step-res">${res}</div><div class="step-lab">Paso 2 de 2 · ¿En qué apartado de la hoja de resumen?</div>`;
  for (const [sheet, , items] of m[3]) {
    h += `<div class="sheet-lab">Hoja del resumen p. ${sheet}</div>`;
    items.forEach(it => {
      h += `<button class="opt h-btn${it[3] ? ' sub' : ''}" data-h="${esc(it[0])}"><span>${esc(it[0])}</span><span class="h-pg">p. ${esc(it[1])}</span></button>`;
    });
  }
  const step2 = document.getElementById('step2');
  step2.innerHTML = h;
  step2.querySelectorAll('.h-btn').forEach(b => { b.onclick = () => pickHeading(b.dataset.h); });
  saveInProgress();
}

function pickHeading(title) {
  if (!bState || bState.step !== 2) return;
  bState.step = 3;
  const q = currentQuestions[currentIndex];
  const okHeads = q.ans.filter(a => a[0] === bState.mod).map(a => a[1]);
  const hOk = okHeads.includes(title);
  document.querySelectorAll('.h-btn').forEach(b => {
    b.disabled = true;
    if (okHeads.includes(b.dataset.h)) b.classList.add('correct');
    else if (b.dataset.h === title) b.classList.add('wrong');
  });
  currentScore += (bState.modOk ? 1 : 0) + (hOk ? 1 : 0);

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  if (bState.modOk && hOk) { fb.textContent = '✅ ¡Tema y apartado correctos!'; fb.className = 'feedback ok'; }
  else if (bState.modOk || hOk) { fb.textContent = bState.modOk ? '🟡 Tema bien, apartado no' : '🟡 Tema no, apartado bien'; fb.className = 'feedback'; }
  else { fb.textContent = '❌ Tema y apartado incorrectos'; fb.className = 'feedback bad'; }

  const m = resumen(bState.mod);
  const where = findHeading(bState.mod, okHeads[0]);
  const it = where.item;
  let text = `📖 Dónde está: tema ${m[0]} (${m[1]}) → hoja del resumen p. ${where.sheet} → «${it[0]}» → libro p. ${it[1]}` + (it[2] ? ` (sección ${it[2]})` : '');
  if (okHeads.length > 1) text += `\nTambién vale: ${okHeads.slice(1).map(t => '«' + t + '»').join(', ')}`;
  const others = q.ans.filter(a => a[0] !== bState.mod);
  if (others.length) text += `\nTambién vale el tema ${others.map(a => a[0] + ' «' + a[1] + '»').join(', ')}`;
  if (it[4]) text += `\n✎ Fórmula: ${it[4][0]}`;
  text += `\n\n${q.exp}`;
  const ex = document.getElementById('explain');
  ex.style.display = 'block';
  ex.textContent = text;

  sessionLog.push({ buscar: true, q: q.q, pickedMod: bState.pickedMod, mod: bState.mod, modOk: bState.modOk,
    pickedH: title, okH: okHeads[0], hOk, exp: text });
  document.getElementById('copy-q-btn').hidden = false;
  document.getElementById('next-btn').hidden = false;
  saveInProgress();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  // In the "buscar" tests each question has two points: the module and the heading
  const isBuscar = currentQuestions.length > 0 && currentQuestions[0].buscar;
  const total = currentQuestions.length * (isBuscar ? 2 : 1);
  document.getElementById('result-label').textContent = isBuscar ? 'aciertos (1 por el tema + 1 por el apartado)' : 'respuestas correctas';
  const progress = getProgress();
  progress[currentTopic] = { lastScore: currentScore, lastTotal: total, date: new Date().toISOString() };
  saveProgress(progress);
  clearInProgress(currentTopic);

  show('screen-result');
  document.getElementById('result-title').textContent = window.CPC_TEMAS[currentTopic].title;
  const pct = Math.round(currentScore / total * 100);
  document.getElementById('result-score').textContent = currentScore + '/' + total + ' (' + pct + '%)';
  document.getElementById('result-score').style.color = pct >= 85 ? '#4CD964' : (pct >= 60 ? '#FFC107' : '#FF6B6B');
}

function retryTopic() { startQuiz(currentTopic); }
// The unfinished test stays saved; it shows in the menu as "▶ Pregunta N/M"
function backToMenu() {
  try { localStorage.removeItem(LAST_TOPIC_KEY); } catch(e) {}
  showMenu();
}

// ---- Init ----
(function init() {
  let unlocked = false;
  try { unlocked = localStorage.getItem(UNLOCK_KEY) === '1'; } catch(e) {}
  if (!unlocked) { show('screen-lock'); return; }
  const inProgress = lastInProgress();
  if (inProgress) {
    resumeQuiz(inProgress);
  } else {
    showMenu();
  }
})();
</script>
