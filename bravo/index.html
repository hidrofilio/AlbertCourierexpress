<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17120d">
<title>Bravo Transfers · Málaga</title>
<meta name="description" content="Private transfers from Málaga with licensed drivers.">
<link rel="icon" type="image/png" href="/api/bravo/icon-64.png">
<link rel="apple-touch-icon" href="/api/bravo/icon-180.png">
<style>
  /* Fase de pruebas, escondida. Colores del logo: negro, dorado y naranja. */
  :root {
    --ink: #17120d; --ink-2: #2a2118; --cream: #faf6ee; --card: #ffffff;
    --gold: #c8922f; --gold-2: #e5b44b; --orange: #df7a2c;
    --muted: #6f6252; --line: #e7dccb; --ok: #2f7d4f; --err: #b3261e;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  .test-bar { background: var(--orange); color: #fff; text-align: center; font-size: .82rem; font-weight: 600; padding: 6px 16px; }

  header.top { background: #fffaf2; color: var(--ink); border-bottom: 3px solid var(--gold-2); }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { flex: none; height: 50px; width: auto; display: block; }
  .word { display: flex; flex-direction: column; line-height: 1; }
  .word b { font-family: Georgia, 'Times New Roman', serif; font-size: 1.4rem; letter-spacing: .08em; color: var(--ink); }
  .word small { font-size: .6rem; letter-spacing: .42em; color: var(--orange); margin-top: 4px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
  .langs button { background: none; border: 0; color: var(--muted); font-weight: 700; font-size: .8rem; padding: 7px 11px; cursor: pointer; }
  .langs button.on { background: var(--ink); color: #fff; }
  .wa { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: #25d366; }

  .hero { background: radial-gradient(120% 90% at 85% 0%, #3a2a17 0%, var(--ink) 55%); color: #f6efe3; padding: 28px 0 40px; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; width: 360px; height: 360px; right: -120px; top: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(229,180,75,.55), rgba(223,122,44,.15) 60%, transparent 70%); pointer-events: none; }
  .hero h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.15; margin: 0 0 10px; position: relative; }
  .hero p.sub { color: #d9cbb0; margin: 0 0 22px; max-width: 560px; position: relative; }

  .booker { background: var(--card); color: var(--ink); border-radius: 16px; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.35); position: relative; max-width: 640px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f3ece0; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  .tabs button { border: 0; background: none; padding: 10px 4px; border-radius: 9px; font-weight: 700; font-size: .92rem; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; }
  .field { margin-bottom: 12px; }
  .field label, .lbl { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 5px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,146,47,.18); }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .chip { border: 1px solid var(--line); background: #fbf8f2; color: var(--ink); border-radius: 999px; padding: 5px 10px; font-size: .8rem; cursor: pointer; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .found { font-size: .8rem; color: var(--ok); margin-top: 5px; min-height: 0; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 4px 0 12px; }
  .check input { width: 20px; height: 20px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 1.02rem; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--gold-2), var(--orange)); color: var(--ink); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .link-btn { background: none; border: 0; color: var(--muted); font-weight: 600; padding: 6px 0; cursor: pointer; font-size: .92rem; }
  .hint { font-size: .85rem; color: var(--muted); margin: 10px 0 0; }
  .hint button { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: inherit; }
  .err { background: #fdecea; color: var(--err); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 0 0 12px; }
  .summary { background: #f7f1e6; border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: .92rem; }
  .summary b { display: block; font-size: 1rem; overflow-wrap: anywhere; }
  .veh { display: grid; grid-template-columns: 44px 1fr auto; grid-template-areas: "ico txt price" "btn btn btn"; gap: 8px 12px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .veh .ico { grid-area: ico; } .veh .txt { grid-area: txt; } .veh .price { grid-area: price; font-size: 1.35rem; font-weight: 800; }
  .veh .txt span { display: block; color: var(--muted); font-size: .85rem; }
  .veh button { grid-area: btn; }
  .veh.off { opacity: .5; }
  .veh-note { font-size: .8rem; color: var(--muted); margin: -4px 0 10px; }
  .done { text-align: center; padding: 8px 0; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .done h2 { margin: 0 0 6px; font-family: Georgia, serif; }
  .test-note { font-size: .8rem; color: var(--orange); font-weight: 600; text-align: center; margin: 10px 0 0; }

  section.band { padding: 44px 0; }
  section.band.alt { background: #f3ece0; }
  h2.sec { font-family: Georgia, 'Times New Roman', serif; font-size: 1.6rem; margin: 0 0 20px; }
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h3 { margin: 6px 0 4px; font-size: 1.05rem; }
  .card p { margin: 0; color: var(--muted); font-size: .93rem; }
  .num { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--gold-2); display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .emoji { font-size: 1.6rem; }
  details.faq { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; margin-bottom: 8px; }
  details.faq summary { font-weight: 700; padding: 13px 0; cursor: pointer; list-style: none; }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::after { content: "+"; float: right; color: var(--gold); font-weight: 800; }
  details.faq[open] summary::after { content: "–"; }
  details.faq p { margin: 0 0 13px; color: var(--muted); }
  .contact-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--ink); color: #fff; border-radius: 999px; padding: 11px 16px; font-weight: 700; font-size: .92rem; overflow-wrap: anywhere; }
  .pill.wa-pill { background: #1f9e4f; }
  footer { background: var(--ink); color: #b8a98d; font-size: .85rem; padding: 26px 0; }
  footer p { margin: 0 0 4px; }

  @media (min-width: 720px) {
    .hero { padding: 48px 0 60px; }
    .booker { padding: 22px; }
    .grid.g3 { grid-template-columns: repeat(3, 1fr); }
    .grid.g4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 980px) { .grid.g4 { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="test-bar" data-i18n="testBar"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/bravo/" aria-label="Bravo Transfers">
      <img src="/api/bravo/logo.png" alt="" width="69" height="50">
      <span class="word"><b>BRAVO</b><small>TRANSFERS</small></span>
    </a>
    <div class="top-actions">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
      <a class="wa" href="https://wa.me/353874592308" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3z"/></svg>
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 data-i18n="heroTitle"></h1>
    <p class="sub" data-i18n="heroSub"></p>

    <div class="booker" id="booker">
      <div class="err" id="err" role="alert" hidden></div>

      <!-- Paso 1: el viaje -->
      <div id="step-search">
        <div class="tabs" role="tablist">
          <button type="button" data-tab="transfer" data-i18n="tabTransfer"></button>
          <button type="button" data-tab="hourly" data-i18n="tabHourly"></button>
          <button type="button" data-tab="group" data-i18n="tabGroup"></button>
        </div>

        <form id="f-transfer" novalidate>
          <div class="field">
            <label for="t-from" data-i18n="from"></label>
            <input id="t-from" autocomplete="off" data-i18n-ph="phPlace">
            <div class="chips" data-chips="t-from" data-places="agp,mz,port"></div>
            <div class="found" data-found="t-from"></div>
          </div>
          <div class="field">
            <label for="t-to" data-i18n="to"></label>
            <input id="t-to" autocomplete="off" data-i18n-ph="phPlace">
            <div class="chips" data-chips="t-to" data-places="agp,centro,marbella"></div>
            <div class="found" data-found="t-to"></div>
          </div>
          <div class="row">
            <div class="field"><label for="t-date" data-i18n="date"></label><input type="date" id="t-date"></div>
            <div class="field"><label for="t-time" data-i18n="time"></label><input type="time" id="t-time" step="300"></div>
          </div>
          <div class="field">
            <label for="t-pax" data-i18n="passengers"></label>
            <select id="t-pax"></select>
          </div>
          <label class="check"><input type="checkbox" id="t-round"> <span data-i18n="roundTrip"></span></label>
          <div class="row" id="t-return" hidden>
            <div class="field"><label for="t-rdate" data-i18n="returnDate"></label><input type="date" id="t-rdate"></div>
            <div class="field"><label for="t-rtime" data-i18n="returnTime"></label><input type="time" id="t-rtime" step="300"></div>
          </div>
          <button class="btn" type="submit" data-i18n="seePrice"></button>
          <p class="hint"><span data-i18n="moreThan7"></span> <button type="button" data-goto-tab="group" data-i18n="groupLink"></button></p>
        </form>

        <form id="f-hourly" novalidate hidden>
          <div class="field">
            <label for="h-from" data-i18n="pickup"></label>
            <input id="h-from" autocomplete="off" data-i18n-ph="phPlace">
            <div class="chips" data-chips="h-from" data-places="agp,centro,port"></div>
            <div class="found" data-found="h-from"></div>
          </div>
          <div class="row">
            <div class="field"><label for="h-date" data-i18n="date"></label><input type="date" id="h-date"></div>
            <div class="field"><label for="h-time" data-i18n="time"></label><input type="time" id="h-time" step="300"></div>
          </div>
          <div class="row">
            <div class="field"><label for="h-hours" data-i18n="hours"></label><select id="h-hours"></select></div>
            <div class="field"><label for="h-pax" data-i18n="passengers"></label><select id="h-pax"></select></div>
          </div>
          <button class="btn" type="submit" data-i18n="seePrice"></button>
        </form>

        <form id="f-group" novalidate hidden>
          <p class="hint" style="margin:0 0 12px" data-i18n="groupIntro"></p>
          <div class="field"><label for="g-from" data-i18n="from"></label><input id="g-from" data-i18n-ph="phPlace"></div>
          <div class="field"><label for="g-to" data-i18n="to"></label><input id="g-to" data-i18n-ph="phPlace"></div>
          <div class="row">
            <div class="field"><label for="g-date" data-i18n="date"></label><input type="date" id="g-date"></div>
            <div class="field"><label for="g-time" data-i18n="time"></label><input type="time" id="g-time" step="300"></div>
          </div>
          <div class="field"><label for="g-pax" data-i18n="people"></label><input type="number" id="g-pax" min="1" max="500" inputmode="numeric" value="10"></div>
          <div class="field"><label for="g-name" data-i18n="name"></label><input id="g-name" autocomplete="name"></div>
          <div class="field"><label for="g-phone" data-i18n="phone"></label><input type="tel" id="g-phone" autocomplete="tel" placeholder="+44 7700 900123"></div>
          <div class="field"><label for="g-email" data-i18n="email"></label><input type="email" id="g-email" autocomplete="email"></div>
          <div class="field"><label for="g-comments" data-i18n="comments"></label><textarea id="g-comments"></textarea></div>
          <button class="btn" type="submit" data-i18n="askQuote"></button>
          <p class="test-note" data-i18n="testNote"></p>
        </form>
      </div>

      <!-- Paso 2: el vehículo y el precio -->
      <div id="step-options" hidden>
        <button type="button" class="link-btn" data-back="search" data-i18n="back"></button>
        <div class="summary" id="opt-summary"></div>
        <div id="opt-list"></div>
      </div>

      <!-- Paso 3: los datos -->
      <form id="step-details" novalidate hidden>
        <button type="button" class="link-btn" data-back="options" data-i18n="backVehicle"></button>
        <div class="summary" id="det-summary"></div>
        <p class="lbl" data-i18n="yourData"></p>
        <div class="field"><label for="d-name" data-i18n="name"></label><input id="d-name" autocomplete="name"></div>
        <div class="field"><label for="d-phone" data-i18n="phone"></label><input type="tel" id="d-phone" autocomplete="tel" placeholder="+44 7700 900123"></div>
        <div class="field"><label for="d-email" data-i18n="email"></label><input type="email" id="d-email" autocomplete="email"></div>
        <div class="field" id="d-flight-field" hidden><label for="d-flight" data-i18n="flight"></label><input id="d-flight" autocomplete="off" placeholder="FR 1234" maxlength="12"></div>
        <div class="row">
          <div class="field"><label for="d-bags" data-i18n="bags"></label><select id="d-bags"></select></div>
          <div class="field"><label for="d-seats" data-i18n="childSeats"></label><select id="d-seats"></select></div>
        </div>
        <div class="field"><label for="d-comments" data-i18n="comments"></label><textarea id="d-comments"></textarea></div>
        <button class="btn" type="submit" data-i18n="confirm"></button>
        <p class="test-note" data-i18n="testNote"></p>
      </form>

      <!-- Paso 4: hecho -->
      <div id="step-done" class="done" hidden>
        <div class="tick">✓</div>
        <h2 id="done-title"></h2>
        <p id="done-text"></p>
        <div class="summary" id="done-summary" style="text-align:left"></div>
        <a class="btn" id="done-doc" href="#" target="_blank" rel="noopener" style="text-decoration:none;margin-bottom:10px;background:#17120d;color:#fff" data-i18n="downloadDoc" hidden></a>
        <button type="button" class="btn" id="new-booking" data-i18n="newBooking"></button>
        <p class="test-note" data-i18n="testNote"></p>
      </div>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <h2 class="sec" data-i18n="how_t"></h2>
    <div class="grid g3">
      <div class="card"><div class="num">1</div><h3 data-i18n="how1_t"></h3><p data-i18n="how1"></p></div>

<section class="band">

      <div class="card"><div class="emoji">💶</div><h3 data-i18n="why1_t"></h3><p data-i18n="why1"></p></div>
      <div class="card"><div class="emoji">🪪</div><h3 data-i18n="why2_t"></h3><p data-i18n="why2"></p></div>

<section class="band alt">
  <div class="wrap">

    <div class="grid g3">
      <div class="card"><div class="emoji">🚗</div><h3 data-i18n="veh_car"></h3><p data-i18n="fleet_car"></p></div>
      <div class="card"><div class="emoji">🚐</div><h3 data-i18n="veh_van"></h3><p data-i18n="fleet_van"></p></div>

  <div class="wrap">
    <h2 class="sec" data-i18n="contact_t"></h2>
    <p data-i18n="contact"></p>
    <div class="contact-row">
      <a class="pill wa-pill" href="https://wa.me/353874592308" target="_blank" rel="noopener">WhatsApp</a>

</section>

<footer>
  <div class="wrap">
    <p><b style="color:#f6efe3">Bravo Transfers</b> · Málaga</p>
    <p data-i18n="footer"></p>
  </div>
</footer>

<script>

      name: $('d-name').value, phone: $('d-phone').value, email: $('d-email').value,
      flight: $('d-flight-field').hidden ? '' : $('d-flight').value,
      bags: Number($('d-bags').value), childSeats: Number($('d-seats').value), comments: $('d-comments').value
    };
    busy(this, true);
    try {
      var r = await api('book', body);
      var o = chosen();
      var summary = tripLine(trip, state.quote) + '<br>' + whenLine(trip) + '<br>' + esc(t('veh_' + o.id)) + ' · ' + esc(money(r.price));
      finish(r.ref, 'doneText', summary, r.doc);
      notify(r.ref, body, r.price, r.km);
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  // Grupos: petición de presupuesto
  $('f-group').addEventListener('submit', async function (ev) {
    ev.preventDefault(); clearErr();
    var body = {
      kind: 'group', lang: lang, fromText: $('g-from').value, toText: $('g-to').value,
      date: $('g-date').value, time: $('g-time').value, passengers: Number($('g-pax').value),
      name: $('g-name').value, phone: $('g-phone').value, email: $('g-email').value, comments: $('g-comments').value
    };
    busy(this, true);
    try {
      if (!body.fromText.trim() || !body.toText.trim()) throw { code: 'bad_places' };
      if (!body.date || !body.time) throw { code: 'needDate' };
      var r = await api('book', body);
      var summary = '<b>' + esc(body.fromText) + ' → ' + esc(body.toText) + '</b>' + esc(fmtDate(body.date) + ' · ' + body.time) +
        '<br>' + esc(t('groupDone').replace('{n}', body.passengers));
      finish(r.ref, 'doneGroup', summary);
      notify(r.ref, body, null, null);
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  function finish(ref, textKey, summary, doc) {
    state.done = { ref: ref, textKey: textKey, summary: summary, doc: doc || '' };
    renderDone(); show('done');
  }
  function renderDone() {
    if (!state.done) return;
    $('done-title').textContent = t('doneTitle').replace('{ref}', state.done.ref);
    $('done-text').textContent = t(state.done.textKey);
    $('done-summary').innerHTML = state.done.summary;
    $('done-doc').hidden = !state.done.doc;
    if (state.done.doc) $('done-doc').href = state.done.doc;
  }
  $('new-booking').addEventListener('click', function () {
    ['f-transfer', 'f-hourly', 'f-group', 'step-details'].forEach(function (id) { $(id).reset(); });
    Object.keys(fields).forEach(function (k) { var f = fields[k]; f.place = null; f.chip = null; f.found.textContent = ''; markChips(f); });
    $('t-return').hidden = true;
    state.trip = state.quote = state.vehicle = state.done = null;
    show('search');
    $('booker').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Aviso a Alberto por correo. Si falla, la reserva ya está guardada en el panel.
  function notify(ref, b, price, km) {
    var lines = ['Reserva ' + ref + ' (PRUEBAS, sin cobrar)', ''];
    if (b.kind === 'group') {
      lines.push('Tipo: GRUPO (pide presupuesto)', 'Desde: ' + b.fromText, 'Hasta: ' + b.toText);
    } else {
      lines.push('Tipo: ' + (b.kind === 'hourly' ? 'Por horas (' + b.hours + ' h)' : 'Traslado' + (b.roundTrip ? ' de ida y vuelta' : '')));
      lines.push('Desde: ' + b.from.label);
      if (b.to) lines.push('Hasta: ' + b.to.label + (km ? ' (' + km + ' km)' : ''));
      lines.push('Vehículo: ' + (b.vehicle === 'van' ? 'Monovolumen' : 'Coche') + ' · Precio: ' + price + ' €');
    }
    lines.push('Día: ' + b.date + ' a las ' + b.time);
    if (b.roundTrip) lines.push('Vuelta: ' + b.returnDate + ' a las ' + b.returnTime);
    lines.push('Personas: ' + b.passengers, '', 'Cliente: ' + b.name, 'Teléfono: ' + b.phone, 'Correo: ' + b.email);
    if (b.flight) lines.push('Vuelo: ' + b.flight);
    if (b.kind !== 'group') lines.push('Maletas: ' + b.bags + ' · Sillas de niño: ' + b.childSeats);
    if (b.comments) lines.push('Comentarios: ' + b.comments);
    lines.push('Idioma: ' + b.lang, '', 'Panel: https://albertcourierexpress.com/bravo/panel/');
    try {
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ access_key: NOTIFY_KEY, subject: 'Bravo Transfers (pruebas) — ' + ref, from_name: 'Bravo Transfers', message: lines.join('\n') })
      }).catch(function () {});
    } catch (e) { /* sin aviso: no pasa nada */ }
  }

  // ---------- idioma ----------
  function applyLang() {
    document.documentElement.lang = lang;
    qsa('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    qsa('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
    qsa('[data-lang]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
    qsa('.chip').forEach(function (b) { b.textContent = PLACES[b.getAttribute('data-place')][lang]; });
    Object.keys(fields).forEach(function (k) { var f = fields[k]; if (f.chip) pickChip(f, f.chip); });
    if (state.step === 'options') renderOptions();
    if (state.step === 'details') renderDetails();
    if (state.step === 'done') renderDone();
    if (!$('err').hidden) clearErr();
  }
  qsa('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('bravo_lang', lang); } catch (e) { /* sin memoria: da igual */ }
      applyLang();
    });
  });

  setTab('transfer');
  applyLang();
})();
</script>
</body>
</html>
