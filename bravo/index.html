  function $(id) { return document.getElementById(id); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var lang = 'es';
  try {
    var saved = localStorage.getItem('bravo_lang');
    if (saved === 'es' || saved === 'en') lang = saved;
    else if ((navigator.language || '').slice(0, 2) !== 'es') lang = 'en';
  } catch (e) { if ((navigator.language || '').slice(0, 2) !== 'es') lang = 'en'; }

  function t(k) { return (T[lang] && T[lang][k]) || T.es[k] || k; }
  function money(n) {
    try { return new Intl.NumberFormat(lang === 'es' ? 'es-ES' : 'en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n); }
    catch (e) { return '€' + n; }
  }
  function fmtDate(d) {
    try { return new Date(d + 'T12:00:00').toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
    catch (e) { return d; }
  }
  function fmtMin(m) { if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + (m % 60 ? (m % 60) + ' min' : ''); }

  // ---------- estado ----------
  var state = { tab: 'transfer', step: 'search', trip: null, quote: null, vehicle: null, done: null, code: '', qbody: null };
  // El hotel o la agencia que manda al cliente (enlace ?p=código): se recuerda 30 días
  var PARTNER = '';
  try {
    var pm = /[?&]p=([a-z0-9][a-z0-9-]{1,29})/.exec(location.search);
    if (pm) localStorage.setItem('bravo_partner', JSON.stringify({ c: pm[1], t: Date.now() }));
    var sp0 = JSON.parse(localStorage.getItem('bravo_partner') || 'null');
    if (sp0 && Date.now() - sp0.t < 30 * 86400000) PARTNER = sp0.c;
  } catch (e) { var pm2 = /[?&]p=([a-z0-9][a-z0-9-]{1,29})/.exec(location.search); if (pm2) PARTNER = pm2[1]; }
  async function quote(body) {
    body.partner = PARTNER; body.code = state.code;
    state.qbody = body;
    return api('quote', body);
  }
  var fields = {};

  function fillSelect(id, from, to, def) {
    var s = $(id); s.innerHTML = '';
    for (var i = from; i <= to; i++) { var o = document.createElement('option'); o.value = i; o.textContent = i; if (i === def) o.selected = o.defaultSelected = true; s.appendChild(o); }
  }
  fillSelect('t-pax', 1, 7, 2); fillSelect('h-pax', 1, 7, 2); fillSelect('h-hours', 2, 12, 3);
  fillSelect('d-bags', 0, 10, 2); fillSelect('d-seats', 0, 4, 0);

  function isoDay(offset) { var d = new Date(Date.now() + offset * 86400000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  ['t-date', 't-rdate', 'h-date', 'g-date'].forEach(function (id) { $(id).min = isoDay(1); });

  // ---------- sitios: botones rápidos + buscador ----------
  qsa('[data-chips]').forEach(function (box) {
    var id = box.getAttribute('data-chips');
    var input = $(id);
    var f = fields[id] = { input: input, box: box, found: document.querySelector('[data-found="' + id + '"]'), place: null, chip: null };
    box.getAttribute('data-places').split(',').forEach(function (key) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('data-place', key);
      b.addEventListener('click', function () { pickChip(f, key); });
      box.appendChild(b);
    });
    input.addEventListener('input', function () { f.place = null; f.chip = null; f.found.textContent = ''; markChips(f); });
  });
  // Parada en el camino (sin botones rápidos)
  fields['t-via'] = { input: $('t-via'), box: document.createElement('div'), found: document.querySelector('[data-found="t-via"]'), place: null, chip: null };
  $('t-via').addEventListener('input', function () { var f = fields['t-via']; f.place = null; f.found.textContent = ''; });
  $('t-via-open').addEventListener('click', function () { $('t-via-box').hidden = false; $('t-via-open').hidden = true; $('t-via').focus(); });
  function setPlace(f, p) {
    f.chip = null; markChips(f);
    f.place = { lat: p.lat, lon: p.lon, label: p.label, airport: /aeropuerto|airport|\bAGP\b/i.test(p.label) };
    f.input.value = p.label; f.found.textContent = '📍 ' + t('found') + ': ' + p.label;
  }
  function pickChip(f, key) {
    var p = PLACES[key];
    f.chip = key;
    f.place = { lat: p.lat, lon: p.lon, label: p[lang], airport: Boolean(p.airport) };
    f.input.value = p[lang]; f.found.textContent = '';
    markChips(f);
  }
  function markChips(f) { qsa('.chip', f.box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-place') === f.chip); }); }

  var lastGeo = 0;
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function geocode(q) {
    // Nominatim: una consulta por segundo como mucho, y sin autocompletar (su norma de uso).
    var gap = 1100 - (Date.now() - lastGeo);
    if (gap > 0) await wait(gap);
    lastGeo = Date.now();
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es' +
      '&viewbox=-5.9,37.5,-3.5,36.1&accept-language=' + lang + '&q=' + encodeURIComponent(q);
    var res;
    try { res = await fetch(url); } catch (e) { throw { code: 'geo' }; }
    if (!res.ok) throw { code: 'geo' };
    var data = await res.json();
    if (!data.length) return null;
    var label = String(data[0].display_name || q).split(',').slice(0, 3).join(',').trim();
    return { lat: Number(data[0].lat), lon: Number(data[0].lon), label: label };
  }
  async function resolve(f) {
    if (f.place) return f.place;
    var q = f.input.value.trim();
    if (q.length < 3) { f.input.focus(); throw { code: 'needPlace' }; }
    var r = await geocode(q);
    if (!r) { f.input.focus(); throw { code: 'notFound', q: q }; }
    r.airport = /aeropuerto|airport|\bAGP\b|flughafen/i.test(q + ' ' + r.label);
    f.place = r;
    f.found.textContent = '📍 ' + t('found') + ': ' + r.label;
    return r;
  }

  // ---------- servidor ----------
  async function api(route, body) {
    var res;
    try {
      res = await fetch('/api/bravo/' + route, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    } catch (e) { throw { code: 'network' }; }
    if (res.status === 401) { location.reload(); throw { code: 'generic' }; }
    var data = {};
    try { data = await res.json(); } catch (e) { /* vacío */ }
    if (!res.ok) throw { code: data.error || 'generic' };
    return data;
  }

  // ---------- mensajes de error ----------
  function showErr(e) {
    var code = (e && e.code) || 'generic';
    var msg = T.es['err_' + code] ? t('err_' + code) : t('err_generic');
    if (code === 'notFound') msg = msg.replace('{q}', e.q || '');
    $('err').textContent = msg; $('err').hidden = false;
    $('err').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearErr() { $('err').hidden = true; $('err').textContent = ''; }
  function busy(form, on) { qsa('button[type=submit]', form).forEach(function (b) { b.disabled = on; }); }

  // ---------- pasos ----------
  function show(step) {
    state.step = step;
    $('step-search').hidden = step !== 'search';
    $('step-options').hidden = step !== 'options';
    $('step-details').hidden = step !== 'details';
    $('step-done').hidden = step !== 'done';
    clearErr();
    if (step !== 'search') $('booker').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function setTab(tab) {
    state.tab = tab;
    qsa('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    $('f-transfer').hidden = tab !== 'transfer';
    $('f-hourly').hidden = tab !== 'hourly';
    $('f-group').hidden = tab !== 'group';
    clearErr();
  }
  qsa('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
  qsa('[data-goto-tab]').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-goto-tab')); }); });
  qsa('[data-back]').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-back')); }); });
  $('t-round').addEventListener('change', function () { $('t-return').hidden = !this.checked; });

  function tooSoon(date, time) {
    var when = new Date(date + 'T' + time + ':00').getTime();
    return !(when > Date.now() + 24 * 3600000 - 60000);
  }

  function tripLine(trip, quote) {
    if (trip.kind === 'hourly') return '<b>' + esc(trip.from.label) + '</b>' + esc(t('hourlyLine').replace('{h}', trip.hours));
    return '<b>' + esc(trip.from.label) + ' → ' + esc(trip.to.label) + '</b>' + (trip.via ? esc(t('stopLine').replace('{s}', trip.via.label)) + '<br>' : '') +
      esc(quote.km + ' km · ~' + fmtMin(quote.minutes));
  }
  function whenLine(trip) {
    var s = fmtDate(trip.date) + ' · ' + trip.time + ' · ' + trip.passengers + ' ' + t('passengers').toLowerCase();
    if (trip.roundTrip) s += '<br>' + esc(t('return')) + ': ' + esc(fmtDate(trip.returnDate) + ' · ' + trip.returnTime);
    return s;
  }

  // Paso 1 → 2: traslado
  $('f-transfer').addEventListener('submit', async function (ev) {
    ev.preventDefault(); clearErr();
    var trip = { kind: 'transfer', date: $('t-date').value, time: $('t-time').value, passengers: Number($('t-pax').value), roundTrip: $('t-round').checked };
    if (trip.roundTrip) { trip.returnDate = $('t-rdate').value; trip.returnTime = $('t-rtime').value; }
    busy(this, true);
    try {
      trip.from = await resolve(fields['t-from']);
      trip.to = await resolve(fields['t-to']);
      if (!$('t-via-box').hidden && $('t-via').value.trim()) trip.via = await resolve(fields['t-via']);
      if (!trip.date || !trip.time) throw { code: 'needDate' };
      if (tooSoon(trip.date, trip.time)) throw { code: 'too_soon' };
      if (trip.roundTrip) {
        if (!trip.returnDate || !trip.returnTime) throw { code: 'needDate' };
        if (trip.returnDate + trip.returnTime <= trip.date + trip.time) throw { code: 'bad_return' };
      }
      var q = await quote({ kind: 'transfer', from: trip.from, to: trip.to, via: trip.via || null, passengers: trip.passengers, roundTrip: trip.roundTrip });
      state.trip = trip; state.quote = q; renderOptions(); show('options');
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  // Paso 1 → 2: por horas
  $('f-hourly').addEventListener('submit', async function (ev) {
    ev.preventDefault(); clearErr();
    var trip = { kind: 'hourly', date: $('h-date').value, time: $('h-time').value, passengers: Number($('h-pax').value), hours: Number($('h-hours').value) };
    busy(this, true);
    try {
      trip.from = await resolve(fields['h-from']);
      if (!trip.date || !trip.time) throw { code: 'needDate' };
      if (tooSoon(trip.date, trip.time)) throw { code: 'too_soon' };
      var q = await quote({ kind: 'hourly', from: trip.from, hours: trip.hours, passengers: trip.passengers });
      state.trip = trip; state.quote = q; renderOptions(); show('options');
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  function renderOptions() {
    var trip = state.trip, q = state.quote;
    $('opt-summary').innerHTML = tripLine(trip, q) + '<br>' + whenLine(trip);
    var html = '<div class="route-anim" aria-hidden="true"><span class="ra-line"></span><span class="ra-dot"></span></div>';
    q.options.forEach(function (o) {
      html += '<div class="veh' + (o.fits ? '' : ' off') + '">' +
        '<div class="ico emoji">' + (o.id === 'van' ? '🚐' : '🚗') + '</div>' +
        '<div class="txt"><b>' + esc(t('veh_' + o.id)) + '</b><span>' + esc(t('upTo').replace('{n}', o.seats)) + '</span></div>' +
        '<div class="price">' + (o.fullPrice ? '<s style="font-size: .8rem; color: var(--muted); font-weight: 600">' + esc(money(o.fullPrice)) + '</s> ' : '') + esc(money(o.price)) + '</div>' +
        '<button type="button" class="btn" data-veh="' + esc(o.id) + '"' + (o.fits ? '' : ' disabled') + '>' + esc(o.fits ? t('choose') : t('tooManyPax')) + '</button></div>';
    });
    if (trip.roundTrip) html += '<p class="veh-note">' + esc(t('roundTripPrice')) + '</p>';
    $('opt-list').innerHTML = html;
    var dsc = q.discount;
    $('code-ok').hidden = !dsc;
    if (dsc) $('code-ok').textContent = '✓ ' + t(dsc.code ? 'codeOk' : 'partnerOk').replace('{p}', String(dsc.pct).replace('.', ',')).replace('{c}', dsc.code || '');
    $('code-open').hidden = Boolean(dsc && dsc.code);
    qsa('[data-veh]', $('opt-list')).forEach(function (b) {
      b.addEventListener('click', function () { state.vehicle = b.getAttribute('data-veh'); renderDetails(); show('details'); });
    });
  }

  $('code-open').addEventListener('click', function () { $('code-form').hidden = false; $('code-open').hidden = true; $('code-in').focus(); });
  $('code-apply').addEventListener('click', async function () {
    clearErr();
    var code = $('code-in').value.trim().toUpperCase();
    if (!code || !state.qbody) return;
    var before = state.code;
    state.code = code;
    this.disabled = true;
    try { state.quote = await quote(Object.assign({}, state.qbody)); renderOptions(); $('code-form').hidden = true; }
    catch (e) { state.code = before; showErr(e); }
    finally { this.disabled = false; }
  });
  function chosen() { return state.quote.options.filter(function (o) { return o.id === state.vehicle; })[0]; }
  function renderDetails() {
    var o = chosen();
    $('det-summary').innerHTML = tripLine(state.trip, state.quote) + '<br>' + whenLine(state.trip) +
      '<br>' + esc(t('veh_' + o.id)) + ' · <b style="display:inline">' + esc(money(o.price)) + '</b>';
    $('d-flight-field').hidden = !(state.trip.from && state.trip.from.airport);
  }

  // Paso 3 → 4: reservar
  $('step-details').addEventListener('submit', async function (ev) {
    ev.preventDefault(); clearErr();
    var trip = state.trip;
    var body = {
      kind: trip.kind, lang: lang, from: trip.from, to: trip.to || null, date: trip.date, time: trip.time, partner: PARTNER, code: state.code,
      passengers: trip.passengers, hours: trip.hours || null, roundTrip: Boolean(trip.roundTrip),
      returnDate: trip.returnDate || '', returnTime: trip.returnTime || '', vehicle: state.vehicle,
      name: $('d-name').value, phone: $('d-phone').value, email: $('d-email').value,
      flight: $('d-flight-field').hidden ? '' : $('d-flight').value,
      bags: Number($('d-bags').value), childSeats: Number($('d-seats').value), comments: $('d-comments').value,
      via: trip.via || null, special: $('d-special').value, meetSign: $('d-sign').checked
    };
    busy(this, true);
    try {
      var r = await api('book', body);
      var o = chosen();
      var summary = tripLine(trip, state.quote) + '<br>' + whenLine(trip) + '<br>' + esc(t('veh_' + o.id)) + ' · ' + esc(money(r.price)) +
        (r.paid ? '' : '<br><b style="color:#b3261e" data-i18n="payPending">' + esc(t('payPending')) + '</b>');
      finish(r.ref, 'doneText', summary, r.doc, r, body.email);
      notify(r.ref, body, r.price, r.km);
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  // Grupos: petición de presupuesto
  $('f-group').addEventListener('submit', async function (ev) {
    ev.preventDefault(); clearErr();
    var body = {
      kind: 'group', lang: lang, partner: PARTNER, fromText: $('g-from').value, toText: $('g-to').value,
      date: $('g-date').value, time: $('g-time').value, passengers: Number($('g-pax').value),
      name: $('g-name').value, phone: $('g-phone').value, email: $('g-email').value, comments: $('g-comments').value
    };
    busy(this, true);
    try {
      if (!body.fromText.trim() || !body.toText.trim()) throw { code: 'bad_places' };
      if (!body.date || !body.time) throw { code: 'needDate' };
      var r = await api('book', body);
      var summary = '<b>' + esc(body.fromText) + ' → ' + esc(body.toText) + '</b>' + esc(fmtDate(body.date) + ' · ' + body.time) +
        '<br>' + esc(t('groupDone').replace('{n}', body.passengers));
      finish(r.ref, 'doneGroup', summary, '', r, body.email);
      notify(r.ref, body, null, null);
    } catch (e) { showErr(e); }
    finally { busy(this, false); }
  });

  function finish(ref, textKey, summary, doc, r, email) {
    state.done = { ref: ref, textKey: textKey, summary: summary, doc: doc || '', inv: (r && r.invoiceDoc) || '', email: email || '',
      emailOn: Boolean(r && r.emailOn), newAccount: Boolean(r && r.newAccount) };
    renderDone(); show('done');
  }
  function renderDone() {
    if (!state.done) return;
    $('done-title').textContent = t('doneTitle').replace('{ref}', state.done.ref);
    $('done-text').textContent = t(state.done.textKey);
    $('done-summary').innerHTML = state.done.summary;
    $('done-doc').hidden = !state.done.doc;
    if (state.done.doc) $('done-doc').href = state.done.doc;
    $('done-inv').hidden = !state.done.inv;
    if (state.done.inv) $('done-inv').href = state.done.inv;
    var d = state.done, msg;
    if (d.emailOn) msg = t('mailSent').replace('{email}', d.email).replace('{inv}', d.inv ? t('mailInv') : '') + (d.newAccount ? t('mailNew') : '');
    else msg = t('mailOff').replace('{email}', d.email);
    $('done-mail').textContent = msg;
    $('done-mail').hidden = !d.email;
  }
  $('new-booking').addEventListener('click', function () {
    ['f-transfer', 'f-hourly', 'f-group', 'step-details'].forEach(function (id) { $(id).reset(); });
    Object.keys(fields).forEach(function (k) { var f = fields[k]; f.place = null; f.chip = null; f.found.textContent = ''; markChips(f); });
    $('t-return').hidden = true;
    $('t-via-box').hidden = true; $('t-via-open').hidden = false;
    state.trip = state.quote = state.vehicle = state.done = null;
    show('search');
    $('booker').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Aviso a Alberto por correo. Si falla, la reserva ya está guardada en el panel.
  function dayEs(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!m) return d || '';
    return ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][new Date(d + 'T12:00:00').getDay()] + ' ' + m[3] + '/' + m[2] + '/' + m[1];
  }
  function notify(ref, b, price, km) {
    var lines = ['Reserva ' + ref + ' (PRUEBAS, sin cobrar)', ''];
    if (b.kind === 'group') {
      lines.push('Tipo: GRUPO (pide presupuesto)', 'Desde: ' + b.fromText, 'Hasta: ' + b.toText);
    } else {
      lines.push('Tipo: ' + (b.kind === 'hourly' ? 'Por horas (' + b.hours + ' h)' : 'Traslado' + (b.roundTrip ? ' de ida y vuelta' : '')));
      lines.push('Desde: ' + b.from.label);
      if (b.via && b.via.label) lines.push('Parada: ' + b.via.label);
      if (b.to) lines.push('Hasta: ' + b.to.label + (km ? ' (' + km + ' km)' : ''));
      lines.push('Vehículo: ' + (b.vehicle === 'van' ? 'Monovolumen' : 'Coche') + ' · Precio: ' + price + ' €' + (b.code ? ' (con el código ' + b.code + ')' : ''));
    }
    lines.push('Día: ' + dayEs(b.date) + ' a las ' + b.time);
    if (b.roundTrip) lines.push('Vuelta: ' + dayEs(b.returnDate) + ' a las ' + b.returnTime);
    lines.push('Personas: ' + b.passengers, '', 'Cliente: ' + b.name, 'Teléfono: ' + b.phone, 'Correo: ' + b.email);
    if (b.flight) lines.push('Vuelo: ' + b.flight);
    else if (b.from && b.from.airport) lines.push('Vuelo: ⚠️ no lo ha puesto');
    if (b.kind !== 'group') lines.push('Maletas: ' + b.bags + ' · Sillas de niño: ' + b.childSeats);
    if (b.special) lines.push('Equipaje especial: ' + (T.es['sp_' + b.special] || b.special));
    if (b.meetSign) lines.push('Cartel con su nombre: sí');
    if (b.partner) lines.push('Viene del hotel o agencia: ' + b.partner);
    if (b.comments) lines.push('Comentarios: ' + b.comments);
    lines.push('Idioma: ' + b.lang, '', 'Panel: https://albertcourierexpress.com/bravo/panel/');
    try {
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ access_key: NOTIFY_KEY, subject: 'Bravo Transfers (pruebas) — ' + ref, from_name: 'Bravo Transfers', message: lines.join('\n') })
      }).catch(function () {});
    } catch (e) { /* sin aviso: no pasa nada */ }
  }

  // ---------- idioma ----------
  function applyLang() {
    document.documentElement.lang = lang;
    qsa('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    qsa('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
    qsa('[data-lang]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
    qsa('.chip').forEach(function (b) { b.textContent = PLACES[b.getAttribute('data-place')][lang]; });
    var sp = $('d-special'), spv = sp.value;
    sp.innerHTML = ['', 'golf', 'bike', 'surf', 'ski', 'wheelchair', 'pram', 'pet', 'other'].map(function (k) { return '<option value="' + k + '">' + esc(t('sp_' + (k || 'none'))) + '</option>'; }).join('');
    sp.value = spv;
    renderDest();
    Object.keys(fields).forEach(function (k) { var f = fields[k]; if (f.chip) pickChip(f, f.chip); });
    if (state.step === 'options') renderOptions();
    if (state.step === 'details') renderDetails();
    if (state.step === 'done') renderDone();
    if (!$('err').hidden) clearErr();
  }
  qsa('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('bravo_lang', lang); } catch (e) { /* sin memoria: da igual */ }
      applyLang();
    });
  });

  // ---------- destinos con su precio «desde» ----------
  var routes = [];
  var DEST_BG = ['linear-gradient(160deg, #f2c261, #df7a2c 60%, #8c4423)', 'linear-gradient(160deg, #7cc4e6, #1f4f99)', 'linear-gradient(160deg, #e7b98a, #b5532a)',
    'linear-gradient(160deg, #c9d6a3, #5f7a3a)', 'linear-gradient(160deg, #f7dc9a, #c8922f 70%, #6e3b2a)'];
  function renderDest() {
    if (!routes.length) return;
    $('dest').innerHTML = routes.map(function (r, i) {
      return '<button type="button" class="dcard" data-dest="' + esc(r.id) + '"><span class="dimg" style="background: ' + DEST_BG[i % DEST_BG.length] + '"></span>' +
        '<b>' + esc(r.name) + '</b><span>' + esc(r.km + ' km · ~' + fmtMin(r.minutes)) + '</span><em>' + esc(t('fromPrice').replace('{p}', money(r.from))) + '</em></button>';
    }).join('');
    $('dest-band').hidden = false;
  }
  $('dest').addEventListener('click', function (ev) {
    var c = ev.target.closest('[data-dest]'); if (!c) return;
    var r = routes.filter(function (x) { return x.id === c.getAttribute('data-dest'); })[0];
    show('search'); setTab('transfer');
    pickChip(fields['t-from'], 'agp');
    setPlace(fields['t-to'], { lat: r.lat, lon: r.lon, label: r.name });
    $('booker').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function () { $('t-date').focus(); }, 400);
  });
  fetch('/api/bravo/routes').then(function (res) { return res.ok ? res.json() : null; }).then(function (d) {
    if (d && d.routes) { routes = d.routes; renderDest(); }
    if (d && d.hero) loadHero();
  }).catch(function () {});

  // ---------- «Reservar otra vez» o «la vuelta» desde Mi cuenta: ?from=lat,lon,sitio&to=… ----------
  function placeParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
    if (!m) return null;
    var v; try { v = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return null; }
    var parts = v.split(','), lat = Number(parts[0]), lon = Number(parts[1]), label = parts.slice(2).join(',').trim().slice(0, 160);
    return isFinite(lat) && isFinite(lon) && label ? { lat: lat, lon: lon, label: label } : null;
  }

  // ---------- la foto de portada hecha con IA, si existe ----------
  // Solo se pide si el servidor dice que existe (lo dice la lista de rutas)
  function loadHero() {
    var hp = new Image();
    hp.onload = function () {
      document.querySelector('.hero').classList.add('photo');
      document.querySelector('.s-sky').style.backgroundImage = 'linear-gradient(180deg, rgba(23,18,13,.55), rgba(23,18,13,.12) 45%, rgba(23,18,13,.85)), url(/api/bravo/hero.jpg)';
    };
    hp.src = '/api/bravo/hero.jpg';
  }

  // ---------- las secciones aparecen al bajar ----------
  // Aparece todo lo que ya está en pantalla o se ha pasado (también si se baja de golpe)
  var revealQueued = false;
  function revealCheck() {
    revealQueued = false;
    var limit = window.innerHeight * 0.92;
    qsa('.reveal:not(.in)').forEach(function (el) { if (el.getBoundingClientRect().top < limit) el.classList.add('in'); });
  }
  window.addEventListener('scroll', function () { if (!revealQueued) { revealQueued = true; requestAnimationFrame(revealCheck); } }, { passive: true });
  window.addEventListener('resize', revealCheck);
  revealCheck();

  setTab('transfer');
  applyLang();
  var pf = placeParam('from'), pt = placeParam('to');
  if (pf) setPlace(fields['t-from'], pf);
  if (pt) setPlace(fields['t-to'], pt);
})();
</script>
</body>
</html>
