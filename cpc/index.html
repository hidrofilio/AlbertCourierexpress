<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CPC Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #001F3F;
    color: #fff;
    min-height: 100vh;
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.6rem; text-align: center; margin-bottom: 0.3rem; }
  .subtitle { text-align: center; color: #a8c5e8; margin-bottom: 2rem; font-size: 0.95rem; }
  .card {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(0,102,255,0.3);
    border-radius: 14px;
    padding: 1.6rem;
    backdrop-filter: blur(8px);
    margin-bottom: 1rem;
  }
  input[type=password], input[type=tel] {
    width: 100%;
    padding: 0.9rem 1rem;
    font-size: 1.3rem;
    letter-spacing: 4px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #0066FF;
    background: rgba(0,0,0,0.3);
    color: #fff;
    margin-bottom: 1rem;
  }
  button {
    display: block;
    width: 100%;
    padding: 0.9rem;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #0066FF;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(0,102,255,0.5);
  }
  button:hover { box-shadow: 0 0 24px rgba(0,102,255,0.8); }
  button.secondary { background: transparent; border: 1px solid #0066FF; box-shadow: none; margin-top: 0.6rem; }
  #err { color: #FF6B6B; text-align: center; margin-bottom: 1rem; min-height: 1.2em; }

  .topic-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .topic-btn {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(0,102,255,0.3);
    border-radius: 10px; padding: 0.9rem 1.1rem; cursor: pointer; text-align: left;
    color: #fff; font-size: 0.95rem;
  }
  .topic-btn:hover { border-color: #0066FF; }
  .badge { font-weight: 700; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap; margin-left: 0.8rem; }
  .badge.none { background: rgba(255,255,255,0.1); color: #a8c5e8; }
  .badge.low { background: rgba(255,107,107,0.25); color: #FF6B6B; }
  .badge.mid { background: rgba(255,193,7,0.25); color: #FFC107; }
  .badge.high { background: rgba(40,167,69,0.25); color: #4CD964; }

  .progress-bar { height: 6px; background: rgba(0,102,255,0.2); border-radius: 3px; overflow: hidden; margin-bottom: 1.4rem; }
  .progress-fill { height: 100%; background: #0066FF; width: 0%; transition: width 0.3s; }
  .q-count { text-align: center; color: #a8c5e8; font-size: 0.85rem; margin-bottom: 0.6rem; }
  .q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.3rem; line-height: 1.5; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 0.9rem 1rem;
    background: rgba(0,0,0,0.2); border: 2px solid rgba(0,102,255,0.3); border-radius: 10px;
    color: #fff; margin-bottom: 0.7rem; cursor: pointer; font-size: 0.95rem;
    box-shadow: none; font-weight: 500;
  }
  .opt:hover { border-color: #0066FF; }
  .opt.correct { border-color: #4CD964; background: rgba(76,217,100,0.2); }
  .opt.wrong { border-color: #FF6B6B; background: rgba(255,107,107,0.2); }
  .opt[disabled] { cursor: default; }
  .explain { background: rgba(0,102,255,0.12); border-left: 3px solid #0066FF; padding: 1rem; border-radius: 8px; margin: 1rem 0; font-size: 0.9rem; line-height: 1.6; display:none; }
  .feedback { text-align: center; font-weight: 700; margin-bottom: 0.8rem; font-size: 1rem; display:none; }
  .feedback.ok { color: #4CD964; }
  .feedback.bad { color: #FF6B6B; }

  .result-score { text-align: center; font-size: 3rem; font-weight: 700; margin: 1rem 0 0.3rem; }
  .result-label { text-align: center; color: #a8c5e8; margin-bottom: 1.5rem; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-lock">
    <h1>🔒 CPC Test</h1>
    <p class="subtitle">Acceso privado</p>
    <div class="card">
      <input type="tel" id="pin" maxlength="4" placeholder="••••" inputmode="numeric" autocomplete="off">
      <div id="err"></div>
      <button onclick="tryUnlock()">Entrar</button>
    </div>
  </div>

  <div id="screen-menu" hidden>
    <h1>📘 CPC Transport Manager</h1>
    <p class="subtitle">Elige un tema para empezar el test</p>
    <div id="overall-stats" class="card" style="text-align:center;"></div>
    <div class="topic-list" id="topic-list"></div>
  </div>

  <div id="screen-quiz" hidden>
    <h1 id="quiz-title"></h1>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-count" id="q-count"></div>
    <div class="card">
      <div class="q-text" id="q-text"></div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="explain" id="explain"></div>
      <button id="next-btn" onclick="nextQuestion()" hidden>Siguiente →</button>
    </div>
    <button class="secondary" onclick="backToMenu()">← Volver a temas</button>
  </div>

  <div id="screen-result" hidden>
    <h1 id="result-title"></h1>
    <div class="card">
      <div class="result-score" id="result-score"></div>
      <div class="result-label">respuestas correctas</div>
      <button onclick="retryTopic()">Repetir este tema</button>
      <button class="secondary" onclick="backToMenu()">Volver a temas</button>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script>
const PIN = '8214';
const STORAGE_KEY = 'cpc_progress_v1';
const UNLOCK_KEY = 'cpc_unlocked_v1';

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e) {}
}

function tryUnlock() {
  const val = document.getElementById('pin').value.trim();
  if (val === PIN) {
    try { localStorage.setItem(UNLOCK_KEY, '1'); } catch(e) {}
    showMenu();
  } else {
    document.getElementById('err').textContent = 'Código incorrecto';
    document.getElementById('pin').value = '';
  }
}
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) {
  ['screen-lock','screen-menu','screen-quiz','screen-result'].forEach(s => {
    document.getElementById(s).hidden = (s !== id);
  });
}

function pctClass(pct) {
  if (pct === null) return 'none';
  if (pct < 60) return 'low';
  if (pct < 85) return 'mid';
  return 'high';
}

function showMenu() {
  show('screen-menu');
  const progress = getProgress();
  const list = document.getElementById('topic-list');
  list.innerHTML = '';
  const keys = Object.keys(window.CPC_TEMAS).sort((a,b) => parseInt(a) - parseInt(b));

  let totalAttempts = 0, totalPct = 0;
  keys.forEach(key => {
    const tema = window.CPC_TEMAS[key];
    const rec = progress[key];
    const pct = rec ? Math.round((rec.lastScore / rec.lastTotal) * 100) : null;
    if (rec) { totalAttempts++; totalPct += pct; }

    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    btn.onclick = () => startQuiz(key);
    btn.innerHTML = `<span>${tema.title} <span style="color:#7fa8d9;font-size:0.8rem;">(${tema.questions.length} preguntas)</span></span>
      <span class="badge ${pctClass(pct)}">${pct === null ? 'Sin intentos' : pct + '%'}</span>`;
    list.appendChild(btn);
  });

  const overall = document.getElementById('overall-stats');
  if (totalAttempts > 0) {
    overall.innerHTML = `<strong>Media general:</strong> ${Math.round(totalPct/totalAttempts)}% &nbsp;·&nbsp; ${totalAttempts}/${keys.length} temas intentados`;
  } else {
    overall.innerHTML = 'Aún no has hecho ningún test. ¡Elige un tema para empezar!';
  }
}

// ---- Quiz state ----
let currentTopic = null;
let currentQuestions = [];
let currentIndex = 0;
let currentScore = 0;
let answered = false;

function startQuiz(topicKey) {
  currentTopic = topicKey;
  const tema = window.CPC_TEMAS[topicKey];
  currentQuestions = shuffle(tema.questions).map(q => {
    // shuffle options too, tracking correct answer text
    const correctText = q.options[q.correct];
    const opts = shuffle(q.options);
    return { q: q.q, options: opts, correct: opts.indexOf(correctText), exp: q.exp };
  });
  currentIndex = 0;
  currentScore = 0;
  document.getElementById('quiz-title').textContent = tema.title;
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const total = currentQuestions.length;
  const q = currentQuestions[currentIndex];
  document.getElementById('progress-fill').style.width = (currentIndex / total * 100) + '%';
  document.getElementById('q-count').textContent = `Pregunta ${currentIndex + 1} de ${total}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('explain').textContent = '';
  document.getElementById('next-btn').hidden = true;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((optText, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = letters[i] + ') ' + optText;
    b.onclick = () => selectAnswer(i);
    optsDiv.appendChild(b);
  });
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIndex];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.correct) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  if (i === q.correct) {
    currentScore++;
    fb.textContent = '✅ ¡Correcto!';
    fb.className = 'feedback ok';
  } else {
    fb.textContent = '❌ Incorrecto';
    fb.className = 'feedback bad';
  }

  const ex = document.getElementById('explain');
  ex.style.display = 'block';
  ex.textContent = q.exp;

  document.getElementById('next-btn').hidden = false;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  const total = currentQuestions.length;
  const progress = getProgress();
  progress[currentTopic] = { lastScore: currentScore, lastTotal: total, date: new Date().toISOString() };
  saveProgress(progress);

  show('screen-result');
  document.getElementById('result-title').textContent = window.CPC_TEMAS[currentTopic].title;
  const pct = Math.round(currentScore / total * 100);
  document.getElementById('result-score').textContent = currentScore + '/' + total + ' (' + pct + '%)';
  document.getElementById('result-score').style.color = pct >= 85 ? '#4CD964' : (pct >= 60 ? '#FFC107' : '#FF6B6B');
}

function retryTopic() { startQuiz(currentTopic); }
function backToMenu() { showMenu(); }

// ---- Init ----
(function init() {
  let unlocked = false;
  try { unlocked = localStorage.getItem(UNLOCK_KEY) === '1'; } catch(e) {}
  if (unlocked) showMenu(); else show('screen-lock');
})();
</script>
</body>
</html>
